# fly.toml — Fly.io configuration for the BetFactor scraper
app = "betfactor-scraper"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  SCRAPE_INTERVAL_MS = "90000"
  NODE_ENV = "production"

[processes]
  app = "node dist/index.js"

[[services]]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
